services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moodmap}
      MYSQL_USER: ${MYSQL_USER:-moodmap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-moodmap_dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - moodmap_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moodmap}
      MYSQL_USER: ${MYSQL_USER:-moodmap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-moodmap_dev}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-chars-of-random}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-720}
      MOOD_TTL_HOURS: ${MOOD_TTL_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  moodmap_mysql:
