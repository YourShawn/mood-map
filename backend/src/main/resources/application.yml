server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mood-map
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:moodmap}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${MYSQL_USER:moodmap}
    password: ${MYSQL_PASSWORD:moodmap_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-use-a-long-random-secret}
    ttl-hours: ${JWT_TTL_HOURS:720}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:80}
  mood:
    ttl-hours: ${MOOD_TTL_HOURS:24}
    default-radius-km: ${MOOD_DEFAULT_RADIUS_KM:5}
    max-radius-km: ${MOOD_MAX_RADIUS_KM:50}
    nearby-limit: ${MOOD_NEARBY_LIMIT:200}
    min-interval-seconds: ${MOOD_MIN_INTERVAL_SECONDS:10}
    privacy-decimals: 3
